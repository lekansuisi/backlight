# C1 Mirror97 RGB · 一期：BLE 蓝牙 + USB 有线双模 + 98 灯 RGB 背光
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# RGB underglow (97 键下灯 + 1 状态灯, 共 98 颗 SK6812, SPI3/P1.07 驱动)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# 初始效果：Solid 常亮；默认亮度适中(避免 98 灯全亮刺眼 & 省电)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=35
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0

# 空闲/USB 断开时自动关灯，省电
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
